name: Drop Hunter v0.9 CI

on:
  push:
    branches: [main, feature/drop-hunter-v0.9]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airdrop-agent/v0.9/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_drop_hunter_core.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airdrop-agent/v0.9/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: airdrop-agent/v0.9/frontend/package.json
      - run: npm install
      - run: npm run build
