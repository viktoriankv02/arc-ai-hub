name: ARC AI HUB Airdrop Agent CI

on:
  push:
    branches: [main]
    paths:
      - 'airdrop-agent/v0.8/**'
      - '.github/workflows/airdrop-agent-ci.yml'
  pull_request:
    paths:
      - 'airdrop-agent/v0.8/**'
      - '.github/workflows/airdrop-agent-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airdrop-agent/v0.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airdrop-agent/v0.8/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
